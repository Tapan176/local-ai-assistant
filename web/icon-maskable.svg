<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square for Android "maskable" icons: the OS crops it to a circle/squircle, so all artwork stays inside the central 80% safe zone. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#00ff88" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#00a85a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#03120b"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#050807"/>
  <circle cx="256" cy="256" r="140" fill="url(#g)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#00ff88" stroke-opacity=".55" stroke-width="10"/>
  <path d="M190 262c24-62 56-62 66 0s42 62 66 0" fill="none" stroke="#04140c" stroke-width="22" stroke-linecap="round" transform="translate(-6 0)"/>
</svg>
